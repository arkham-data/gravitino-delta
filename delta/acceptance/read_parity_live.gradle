// Ordinary read parity thin app; retain qualified Hadoop pins and serialized test memory.
gradle.projectsEvaluated {
  def owner = rootProject.project(':spark-connector:spark-delta-ranger-3.5')
  owner.configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    resolutionStrategy.eachDependency { if (requested.group == 'org.apache.hadoop') useVersion('3.3.6') }
  }
  owner.dependencies.add('testRuntimeOnly', 'org.apache.hadoop:hadoop-aws:3.3.6')
  owner.dependencies.add('testRuntimeOnly', 'com.amazonaws:aws-java-sdk-bundle:1.12.367')
  owner.tasks.named('test').configure {
    jvmArgs = jvmArgs.findAll { !it.toString().startsWith('-Xmx') }
    maxHeapSize = '4g'
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    if (rootProject.findProperty('cdfLiveXml')) reports.junitXml.outputLocation.set(new File(rootProject.findProperty('cdfLiveXml').toString()))
  }
  def runtimeOwner = rootProject.project(':spark-connector:spark-delta-ranger-runtime-3.5')
  runtimeOwner.tasks.named('shadowJar').configure {
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
  }
  owner.tasks.register('readParityLiveThinJar', org.gradle.api.tasks.bundling.Jar) { jarTask ->
    jarTask.dependsOn(owner.tasks.named('testClasses'))
    jarTask.archiveFileName.set('read-parity-live.jar')
    jarTask.destinationDirectory.set(new File((rootProject.findProperty('readParityLiveAppOut') ?: 'build/read-parity-live-app').toString()))
    jarTask.doLast {
      def digest = { File file ->
        def hash = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
          byte[] bytes = new byte[1024 * 1024]
          int count
          while ((count = input.read(bytes)) >= 0) hash.update(bytes, 0, count)
        }
        hash.digest().encodeHex().toString()
      }
      def inputs = ['compileClasspath', 'testCompileClasspath'].collectEntries { name ->
        [(name): owner.configurations.getByName(name).files.sort { it.absolutePath }.collectEntries { file ->
          [(file.canonicalPath): digest(file)]
        }]
      }
      def receipt = new File(jarTask.destinationDirectory.get().asFile, 'read-parity-build-inputs.json')
      receipt.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(inputs)) + '\n'
    }
    jarTask.from(owner.sourceSets.test.output) {
      ['DeltaRangerLiveReadParity', 'DeltaRangerLiveMetadataBarrier', 'DeltaRangerLivePhasePin', 'DeltaRangerLiveAppend', 'DeltaRangerDownloadedSecurity', 'DeltaRangerCallbackGateway', 'DeltaRangerStartupCache'].each { name ->
        include("org/apache/gravitino/spark/connector/delta/ranger/${name}.class")
        include("org/apache/gravitino/spark/connector/delta/ranger/${name}\$*.class")
      }
    }
  }
}
